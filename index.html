<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยมอบหมายงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #F4F6F9; --card: #FFFFFF; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0;
    --brand: #06C755; --brand-ink: #FFFFFF; --accent: #2563EB;
    --new: #64748B; --ack: #2563EB; --prog: #D97706; --sub: #7C3AED; --rev: #E11D48; --done: #16A34A; --cancel: #6B7280;
    --danger: #DC2626; --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans Thai', system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .top .back { border: 0; background: none; font-size: 22px; padding: 0 6px 0 0; cursor: pointer; display: none; }
  .top h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #CBD5E1; object-fit: cover; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #fff; }
  main { padding: 14px 16px 96px; max-width: 640px; margin: 0 auto; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  .tabbar button { flex: 1; border: 0; background: none; padding: 8px 2px 9px; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
  .tabbar button .ic { font-size: 20px; line-height: 1.2; }
  .tabbar button.on { color: var(--brand); font-weight: 600; }
  .tabbar button.plus .ic { background: var(--brand); color: #fff; border-radius: 12px; width: 40px; height: 30px; display: grid; place-items: center; font-size: 22px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
  .section-title { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 2px 8px; letter-spacing: .2px; }
  .hello { display: flex; gap: 12px; align-items: center; }
  .hello .avatar { width: 46px; height: 46px; font-size: 18px; }
  .hello b { font-size: 18px; display: block; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; border: 0; text-align: left; cursor: pointer; }
  .tile .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .tile .l { font-size: 12.5px; color: var(--muted); }
  .tile.warn .n { color: var(--danger); } .tile.violet .n { color: var(--sub); } .tile.amber .n { color: var(--prog); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .c { opacity: .7; margin-left: 3px; }
  .task { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; position: relative; padding-left: 16px; }
  .task::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--pc, var(--line)); }
  .task .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .task .t { font-weight: 600; font-size: 15.5px; margin: 3px 0 6px; word-break: break-word; }
  .task .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 8px; margin-top: 6px; }
  .task .meta .late { color: var(--danger); font-weight: 600; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .pbar { height: 6px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
  .empty { text-align: center; color: var(--muted); padding: 36px 10px; }
  .empty .big { font-size: 40px; }
  label.f { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 5px; }
  input[type=text], input[type=search], input[type=datetime-local], textarea, select {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  textarea { resize: vertical; min-height: 80px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 0; font-size: 13.5px; cursor: pointer; }
  .seg button.on { color: #fff; border-color: transparent; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .quick button { border: 1px dashed #94A3B8; background: none; border-radius: 8px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 15.5px; cursor: pointer; background: var(--brand); color: var(--brand-ink); margin-top: 10px; }
  .btn.sec { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.blue { background: var(--accent); } .btn.violet { background: var(--sub); } .btn.red { background: var(--danger); }
  .btn.ghost-red { background: #fff; color: var(--danger); border: 1px solid #FECACA; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .btn { margin-top: 10px; }
  .people { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .person:last-child { border-bottom: 0; }
  .person input { width: 18px; height: 18px; accent-color: var(--brand); }
  .person .nm { flex: 1; } .person .dp { font-size: 12px; color: var(--muted); }
  .picked { font-size: 12.5px; color: var(--brand); font-weight: 600; margin-top: 6px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; font-size: 14px; margin: 10px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
  .detail { white-space: pre-wrap; word-break: break-word; background: #F8FAFC; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .range { display: flex; align-items: center; gap: 12px; }
  .range input[type=range] { flex: 1; accent-color: var(--prog); height: 28px; }
  .range output { font-weight: 700; font-size: 20px; width: 58px; text-align: right; }
  .photo { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .photo label { border: 1px dashed #94A3B8; border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .photo img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; }
  .photo .x { border: 0; background: none; color: var(--danger); cursor: pointer; font-size: 13px; }
  .timeline { position: relative; margin-left: 8px; padding-left: 18px; border-left: 2px solid var(--line); }
  .ev { position: relative; padding-bottom: 14px; }
  .ev::before { content: ''; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--dc, #94A3B8); border: 2px solid var(--bg); }
  .ev .h { font-size: 13px; } .ev .h b { font-weight: 600; }
  .ev .tm { font-size: 11.5px; color: var(--muted); }
  .ev .n { white-space: pre-wrap; word-break: break-word; font-size: 14px; background: var(--card); border-radius: 10px; padding: 8px 10px; margin-top: 4px; box-shadow: var(--shadow); }
  .ev img { max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 6px; display: block; }
  details.manage summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.manage summary::after { content: '▾'; color: var(--muted); }
  details.manage[open] summary::after { content: '▴'; }
  .note-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .banner { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
  .banner.warn { background: #FEF2F2; color: #991B1B; } .banner.info { background: #EFF6FF; color: #1E40AF; } .banner.mock { background: #FEF9C3; color: #854D0E; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--danger); }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: none; place-items: center; z-index: 30; }
  #busy.show { display: grid; }
  .spin { width: 34px; height: 34px; border: 3px solid #CBD5E1; border-top-color: var(--brand); border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .skel { height: 84px; border-radius: var(--radius); background: linear-gradient(90deg, #E9EEF4 25%, #F4F6F9 50%, #E9EEF4 75%); background-size: 200% 100%; animation: sk 1.2s infinite; margin-bottom: 12px; }
  @keyframes sk { to { background-position: -200% 0; } }
  .boot { text-align: center; padding: 80px 20px; color: var(--muted); }
  .boot .spin { margin: 0 auto 14px; }
</style>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" aria-label="ย้อนกลับ">‹</button>
  <h1 id="title">ผู้ช่วยมอบหมายงาน</h1>
  <div id="meAvatar"></div>
</header>
<main id="view"><div class="boot"><div class="spin"></div>กำลังเชื่อมต่อ LINE…</div></main>
<nav class="tabbar" id="tabbar" hidden>
  <button data-go="home"><span class="ic">🏠</span>หน้าหลัก</button>
  <button data-go="mine"><span class="ic">📋</span>งานของฉัน</button>
  <button data-go="assign" class="plus" id="tabAssign"><span class="ic">＋</span>สั่งงาน</button>
  <button data-go="assigned" id="tabAssigned"><span class="ic">📌</span>งานที่สั่ง</button>
</nav>
<div id="toast"></div>
<div id="busy"><div class="spin"></div></div>

<script>
/* =========================================================
 *  ตั้งค่า — แก้ 2 บรรทัดนี้ให้เป็นของคุณ
 * ========================================================= */
const CONFIG = {
  LIFF_ID: '2012131999-9rIDUEGf',
  API_URL: 'https://script.google.com/macros/s/AKfycby7izEQ85dkEqs7SJNT2Ul9NlaMoNb8taauWjmofdfHLwzn9vODNWEx_3l9DlMm_0SlYw/exec',
};
// เปิดไฟล์นี้ในเบราว์เซอร์ตรง ๆ (ยังไม่ตั้งค่า) หรือเติม ?mock=1 จะเข้าโหมดตัวอย่างพร้อมข้อมูลจำลอง
const IS_MOCK = new URLSearchParams(location.search).has('mock') || CONFIG.LIFF_ID.indexOf('YOUR') === 0;

/* ---------- ค่าคงที่ ---------- */
const STATUS_TH = { NEW: 'รอรับทราบ', ACK: 'รับทราบแล้ว', IN_PROGRESS: 'กำลังดำเนินการ', SUBMITTED: 'รอตรวจรับ', REVISE: 'ส่งกลับแก้ไข', DONE: 'เสร็จสิ้น', CANCELLED: 'ยกเลิก' };
const STATUS_COLOR = { NEW: '#64748B', ACK: '#2563EB', IN_PROGRESS: '#D97706', SUBMITTED: '#7C3AED', REVISE: '#E11D48', DONE: '#16A34A', CANCELLED: '#6B7280' };
const PRIORITY_TH = { LOW: 'ต่ำ', NORMAL: 'ปกติ', HIGH: 'ด่วน', URGENT: 'ด่วนมาก' };
const PRIORITY_COLOR = { LOW: '#64748B', NORMAL: '#0284C7', HIGH: '#EA580C', URGENT: '#DC2626' };
const ACTIVE = ['NEW', 'ACK', 'IN_PROGRESS', 'REVISE', 'SUBMITTED'];
const TYPE_COLOR = { CREATE: '#0284C7', ACK: '#2563EB', PROGRESS: '#D97706', SUBMIT: '#7C3AED', APPROVE: '#16A34A', REVISE: '#E11D48', CANCEL: '#6B7280', EDIT: '#0EA5E9', COMMENT: '#0F766E' };
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

const S = { me: null, stats: null, users: null, page: 'home', params: {}, filter: {}, img: {}, cache: {} };
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ---------- ตัวช่วยแสดงผล ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(iso, noTime) {
  if (!iso) return '-';
  const d = new Date(iso); if (isNaN(d)) return '-';
  const be = (d.getFullYear() + 543) % 100;
  let s = d.getDate() + ' ' + TH_MONTHS[d.getMonth()] + ' ' + String(be).padStart(2, '0');
  if (!noTime) s += ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return s;
}
function dueText(t) {
  if (!t.dueDate) return '-';
  const d = new Date(t.dueDate), now = new Date();
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 86400000);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (!ACTIVE.includes(t.status)) return fmt(t.dueDate);
  if (t.overdue) return days === 0 ? 'เลยเวลา ' + hm + ' วันนี้' : 'เกินกำหนด ' + Math.abs(days) + ' วัน';
  if (days === 0) return 'วันนี้ ' + hm;
  if (days === 1) return 'พรุ่งนี้ ' + hm;
  if (days < 7) return 'อีก ' + days + ' วัน (' + fmt(t.dueDate, true) + ')';
  return fmt(t.dueDate);
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'เมื่อสักครู่';
  if (s < 3600) return Math.floor(s / 60) + ' นาทีที่แล้ว';
  if (s < 86400) return Math.floor(s / 3600) + ' ชม.ที่แล้ว';
  if (s < 86400 * 7) return Math.floor(s / 86400) + ' วันที่แล้ว';
  return fmt(iso);
}
function badge(text, color) { return `<span class="badge" style="background:${color}">${esc(text)}</span>`; }
function statusBadge(st) { return badge(STATUS_TH[st] || st, STATUS_COLOR[st] || '#64748B'); }
function prioBadge(p) { return badge(PRIORITY_TH[p] || 'ปกติ', PRIORITY_COLOR[p] || '#0284C7'); }
function pbar(pct, color) { return `<div class="pbar"><i style="width:${Math.max(0, Math.min(100, pct))}%;background:${color}"></i></div>`; }
function initials(name) { return esc(String(name || '?').trim().slice(0, 1).toUpperCase()); }
function avatar(name, pic, size, extra) {
  let st = (size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;` : '') + (extra || '');
  if (pic) return `<img class="avatar" style="${st}" src="${esc(pic)}" alt="">`;
  const hue = [...String(name || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return `<div class="avatar" style="background:hsl(${hue} 45% 55%);${st}">${initials(name)}</div>`;
}
function toast(msg, isErr) {
  const el = $('#toast'); el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.className = '', isErr ? 4200 : 2600);
}
function busy(on) { $('#busy').classList.toggle('show', !!on); }
function skeleton(n) { return '<div class="skel"></div>'.repeat(n || 3); }
function toLocalInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- เรียก API ---------- */
async function getIdToken() {
  const dec = liff.getDecodedIDToken();
  if (!dec || dec.exp * 1000 < Date.now() + 60000) { relogin(); throw new Error('AUTH'); }
  return liff.getIDToken();
}
function relogin() {
  try { liff.logout(); } catch (e) { }
  liff.login({ redirectUri: location.href });
}
async function api(action, params) {
  if (IS_MOCK) return MOCK.call(action, params || {});
  const idToken = await getIdToken();
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // ไม่ต้องทำ CORS preflight
    body: JSON.stringify({ action, idToken, params: params || {} }),
  });
  const j = await res.json();
  if (!j.ok) {
    if (j.code === 'AUTH') { relogin(); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j.data;
}
async function act(action, params, okMsg) {
  busy(true);
  try {
    const r = await api(action, params);
    if (okMsg) toast(okMsg);
    S.cache = {};
    return r;
  } catch (e) {
    if (e.message !== 'AUTH') toast(e.message, true);
    throw e;
  } finally { busy(false); }
}

/* ---------- เส้นทางหน้า ---------- */
const PAGES = { home: pageHome, mine: pageMine, assigned: pageAssigned, assign: pageAssign, task: pageTask, profile: pageProfile };
const TITLES = { home: 'ผู้ช่วยมอบหมายงาน', mine: 'งานของฉัน', assigned: 'งานที่สั่ง', assign: 'สั่งงานใหม่', task: 'รายละเอียดงาน', profile: 'ข้อมูลของฉัน' };

function go(page, params, replace) {
  S.page = PAGES[page] ? page : 'home';
  S.params = params || {};
  const qs = new URLSearchParams(Object.assign({ page: S.page }, S.params, IS_MOCK ? { mock: 1 } : {})).toString();
  try { history[replace ? 'replaceState' : 'pushState']({ page: S.page, params: S.params }, '', '?' + qs); } catch (e) { }
  render();
}
window.addEventListener('popstate', ev => {
  const st = ev.state || {}; S.page = st.page || 'home'; S.params = st.params || {}; render();
});

async function render() {
  $('#title').textContent = TITLES[S.page];
  $('#backBtn').style.display = (S.page === 'task' || S.page === 'profile') ? 'block' : 'none';
  $$('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.go === S.page));
  const view = $('#view');
  view.innerHTML = skeleton(3);
  window.scrollTo(0, 0);
  const token = (render._n = (render._n || 0) + 1);
  try {
    const html = await PAGES[S.page](S.params);
    if (token !== render._n) return; // ผู้ใช้เปลี่ยนหน้าไปแล้ว
    view.innerHTML = (IS_MOCK ? '<div class="banner mock">โหมดตัวอย่าง — ข้อมูลจำลอง ยังไม่เชื่อมต่อระบบจริง</div>' : '') + html;
    if (PAGES[S.page].after) PAGES[S.page].after(S.params);
  } catch (e) {
    if (token !== render._n) return;
    if (e.message === 'AUTH') return;
    view.innerHTML = `<div class="empty"><div class="big">⚠️</div>${esc(e.message)}<br><button class="btn sec" style="max-width:200px;margin:14px auto 0" onclick="render()">ลองใหม่</button></div>`;
  }
}

/* ---------- หน้าหลัก ---------- */
async function pageHome() {
  const [me, mine] = await Promise.all([api('me'), api('listTasks', { scope: 'mine' })]);
  S.me = me.user; S.stats = me.stats; applyRole();
  const s = me.stats, u = me.user;
  const upcoming = mine.filter(t => ACTIVE.includes(t.status) && t.status !== 'SUBMITTED').slice(0, 3);
  let h = `<div class="card hello" onclick="go('profile')">${avatar(u.name, u.pictureUrl)}<div style="flex:1"><span style="color:var(--muted);font-size:13px">สวัสดี</span><b>${esc(u.name)}</b>${u.department ? `<span style="font-size:12.5px;color:var(--muted)">${esc(u.department)}</span>` : ''}</div><span style="color:var(--muted)">›</span></div>`;
  if (s.mine.revise) h += `<div class="banner warn">🔁 มี ${s.mine.revise} งานที่ผู้สั่งขอให้แก้ไข</div>`;
  if (u.canAssign && s.assigned.waitingReview) h += `<div class="banner info">📤 มี ${s.assigned.waitingReview} งานรอคุณตรวจรับ</div>`;
  h += `<div class="section-title">งานที่ต้องทำ</div><div class="grid">
    ${tile(s.mine.active, 'ค้างอยู่', '', "go('mine',{f:'active'})")}
    ${tile(s.mine.dueToday, 'ครบกำหนดวันนี้', s.mine.dueToday ? 'amber' : '', "go('mine',{f:'active'})")}
    ${tile(s.mine.overdue, 'เกินกำหนด', s.mine.overdue ? 'warn' : '', "go('mine',{f:'overdue'})")}
    ${tile(s.mine.newCount, 'รอฉันรับทราบ', '', "go('mine',{f:'new'})")}
  </div>`;
  if (u.canAssign) {
    h += `<div class="section-title">งานที่ฉันสั่ง</div><div class="grid">
      ${tile(s.assigned.waitingReview, 'รอตรวจรับ', s.assigned.waitingReview ? 'violet' : '', "go('assigned',{f:'review'})")}
      ${tile(s.assigned.overdue, 'เกินกำหนด', s.assigned.overdue ? 'warn' : '', "go('assigned',{f:'overdue'})")}
      ${tile(s.assigned.notAcked, 'ผู้รับยังไม่รับทราบ', '', "go('assigned',{f:'new'})")}
      ${tile(s.assigned.active, 'ยังไม่ปิดทั้งหมด', '', "go('assigned',{f:'active'})")}
    </div>`;
  }
  h += `<div class="section-title">ใกล้ครบกำหนด</div>`;
  h += upcoming.length ? upcoming.map(t => taskCard(t, 'mine')).join('') : `<div class="card empty" style="padding:22px">🎉 ไม่มีงานค้าง</div>`;
  h += `<button class="card hello" style="width:100%;border:0;text-align:left;cursor:pointer;margin-top:18px" onclick="openGuide()"><span style="font-size:26px">📖</span><div style="flex:1"><b style="font-size:15.5px">คู่มือการใช้งาน</b><span style="font-size:12.5px;color:var(--muted)">วิธีรับงาน สั่งงาน และสั่งงานในไลน์กลุ่ม</span></div><span style="color:var(--muted)">›</span></button>`;
  return h;
}
function tile(n, label, cls, onclick) { return `<button class="tile ${cls}" onclick="${onclick}"><div class="n">${n}</div><div class="l">${esc(label)}</div></button>`; }

function taskCard(t, scope) {
  const who = scope === 'mine' ? 'จาก ' + t.assignerName : 'ถึง ' + t.assigneeName;
  return `<button class="card task" style="--pc:${PRIORITY_COLOR[t.priority]}" onclick="go('task',{id:'${esc(t.taskId)}'})">
    <div class="row1"><span>${esc(t.taskId)} · ${esc(who)}</span>${statusBadge(t.status)}</div>
    <div class="t">${t.priority === 'URGENT' ? '🔴 ' : t.priority === 'HIGH' ? '🟠 ' : ''}${esc(t.title)}</div>
    ${pbar(t.progress, STATUS_COLOR[t.status])}
    <div class="meta"><span class="${t.overdue ? 'late' : ''}">⏱ ${esc(dueText(t))}</span><span>${t.progress}%</span></div>
  </button>`;
}

/* ---------- รายการงาน ---------- */
const FILTERS = {
  mine: [['active', 'ค้างอยู่'], ['overdue', 'เกินกำหนด'], ['new', 'รอรับทราบ'], ['revise', 'ต้องแก้ไข'], ['review', 'ส่งแล้ว รอตรวจ'], ['closed', 'ปิดแล้ว'], ['all', 'ทั้งหมด']],
  assigned: [['active', 'ยังไม่ปิด'], ['review', 'รอตรวจรับ'], ['overdue', 'เกินกำหนด'], ['new', 'ยังไม่รับทราบ'], ['closed', 'ปิดแล้ว'], ['all', 'ทั้งหมด']],
};
const FILTER_FN = {
  active: t => ACTIVE.includes(t.status), overdue: t => t.overdue, new: t => t.status === 'NEW',
  revise: t => t.status === 'REVISE', review: t => t.status === 'SUBMITTED', closed: t => !ACTIVE.includes(t.status), all: () => true,
};
async function loadList(scope) {
  if (!S.cache[scope]) S.cache[scope] = await api('listTasks', { scope });
  return S.cache[scope];
}
async function pageMine(p) { return listPage('mine', p); }
async function pageAssigned(p) {
  if (S.me && !S.me.canAssign) return `<div class="empty"><div class="big">🔒</div>คุณยังไม่มีสิทธิ์สั่งงาน<br>กรุณาติดต่อผู้ดูแลระบบ</div>`;
  return listPage(p.all === '1' ? 'all' : 'assigned', p);
}
async function listPage(scope, p) {
  const key = scope === 'all' ? 'assigned' : scope;
  const f = p.f || S.filter[key] || 'active';
  S.filter[key] = f;
  const list = await loadList(scope);
  const person = p.person || '';
  const q = (p.q || '').trim().toLowerCase();
  let rows = list.filter(FILTER_FN[f] || FILTER_FN.active);
  if (person) rows = rows.filter(t => t.assigneeId === person);
  if (q) rows = rows.filter(t => (t.title + ' ' + t.taskId + ' ' + t.assigneeName + ' ' + t.assignerName).toLowerCase().includes(q));
  let h = '';
  if (scope !== 'mine' && S.me && S.me.isAdmin) {
    h += `<div class="chips"><button class="chip ${scope === 'assigned' ? 'on' : ''}" onclick="setParam({all:''})">งานที่ฉันสั่ง</button><button class="chip ${scope === 'all' ? 'on' : ''}" onclick="setParam({all:'1'})">ทั้งองค์กร (ผู้ดูแล)</button></div>`;
  }
  h += `<div class="chips">` + FILTERS[key].map(([k, l]) => {
    const c = list.filter(FILTER_FN[k]).length;
    return `<button class="chip ${k === f ? 'on' : ''}" onclick="setParam({f:'${k}'})">${l}<span class="c">${c}</span></button>`;
  }).join('') + `</div>`;
  const row = [`<input type="search" id="q" placeholder="ค้นหาชื่องาน / รหัส" value="${esc(p.q || '')}">`];
  if (scope !== 'mine') {
    const people = {};
    list.forEach(t => people[t.assigneeId] = t.assigneeName);
    row.push(`<select id="person"><option value="">ผู้รับทุกคน</option>${Object.entries(people).sort((a, b) => a[1].localeCompare(b[1], 'th')).map(([id, n]) => `<option value="${esc(id)}" ${id === person ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`);
  }
  if (scope !== 'mine' && rows.length && f !== 'closed') {
    const avg = Math.round(rows.reduce((a, t) => a + t.progress, 0) / rows.length);
    h += `<div class="card" style="padding:10px 14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>ความคืบหน้าเฉลี่ย ${rows.length} งาน</span><b>${avg}%</b></div>${pbar(avg, '#06C755')}</div>`;
  }
  h += `<div style="display:grid;grid-template-columns:${row.length > 1 ? '1fr 1fr' : '1fr'};gap:8px;margin-bottom:12px">${row.join('')}</div>`;
  h += rows.length ? rows.map(t => taskCard(t, scope === 'mine' ? 'mine' : 'assigned')).join('')
    : `<div class="empty"><div class="big">${f === 'active' ? '🎉' : '🗂️'}</div>${f === 'active' ? 'ไม่มีงานค้าง' : 'ไม่มีงานในหมวดนี้'}</div>`;
  return h;
}
function setParam(ch) { go(S.page, Object.assign({}, S.params, ch), true); }
function listAfter() {
  const key = S.page;
  const q = $('#q'), person = $('#person');
  const apply = () => go(key, Object.assign({}, S.params, { q: q.value, person: person ? person.value : '' }), true);
  let t; if (q) q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { apply(); setTimeout(() => { const n = $('#q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); }, 350); });
  if (person) person.addEventListener('change', apply);
}
pageMine.after = listAfter; pageAssigned.after = listAfter;

/* ---------- สั่งงาน ---------- */

  if (!S.users) S.users = await api('users');

    <div class="picked" id="picked"></div>
    <label class="f">ความเร่งด่วน</label>

    <label class="f">กำหนดส่ง *</label>
    <input type="datetime-local" name="due" value="${toLocalInput(d)}" required>
    <div class="quick" id="quickDue">
      <button type="button" data-d="0">วันนี้ 17:00</button><button type="button" data-d="1">พรุ่งนี้ 17:00</button>
      <button type="button" data-d="3">อีก 3 วัน</button><button type="button" data-d="7">อีก 1 สัปดาห์</button>
    </div>
    <button class="btn" type="submit">📨 สั่งงานและแจ้งผู้รับ</button>
  </form>`;
}
pageAssign.after = function () {
  const form = $('#assignForm'); if (!form) return;
  let prio = 'NORMAL';
  const updatePicked = () => {
    const n = $$('input[name=assignee]:checked').length;
    $('#picked').textContent = n ? `เลือกแล้ว ${n} คน` : '';
  };
  $('#people').addEventListener('change', updatePicked);
  $('#pq').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $$('.person').forEach(p => p.style.display = !q || p.dataset.k.includes(q) ? '' : 'none');
  });
  $$('#prio button').forEach(b => b.onclick = () => {
    prio = b.dataset.v;
    $$('#prio button').forEach(x => { x.classList.toggle('on', x === b); x.style.background = x === b ? PRIORITY_COLOR[x.dataset.v] : ''; });
  });
  $$('#quickDue button').forEach(b => b.onclick = () => {
    const d = new Date(); d.setDate(d.getDate() + Number(b.dataset.d)); d.setHours(17, 0, 0, 0);
    form.due.value = toLocalInput(d);
  });
  form.onsubmit = async e => {
    e.preventDefault();
    const ids = $$('input[name=assignee]:checked').map(x => x.value);
    if (!form.title.value.trim()) return toast('กรุณาระบุชื่องาน', true);
    if (!ids.length) return toast('กรุณาเลือกผู้รับงาน', true);
    if (!form.due.value) return toast('กรุณาระบุกำหนดส่ง', true);
    const due = new Date(form.due.value);
    if (due < new Date()) return toast('กำหนดส่งต้องเป็นเวลาในอนาคต', true);
    try {
      const created = await act('createTask', { title: form.title.value, detail: form.detail.value, assigneeIds: ids, priority: prio, dueDate: due.toISOString() });
      $('#view').innerHTML = `<div class="card empty"><div class="big">✅</div><b>สั่งงานเรียบร้อย ${created.length} งาน</b><br>ระบบแจ้งเตือนผู้รับในไลน์แล้ว<br><span style="font-size:13px">${created.map(t => esc(t.taskId + ' → ' + t.assigneeName)).join('<br>')}</span>
        <div class="row2" style="margin-top:8px"><button class="btn sec" onclick="go('assign')">สั่งงานต่อ</button><button class="btn" onclick="go('assigned',{f:'active'})">ดูงานที่สั่ง</button></div></div>`;
    } catch (err) { }
  };
};

/* ---------- รายละเอียดงาน ---------- */
async function pageTask(p) {
  if (!S.me) { const me = await api('me'); S.me = me.user; applyRole(); }
  const { task: t, updates } = await api('getTask', { id: p.id });
  S.task = t; S.img = {};
  let h = `<div class="card">
    <div class="row1" style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)"><span>${esc(t.taskId)} ${prioBadge(t.priority)}</span>${statusBadge(t.status)}</div>
    <h2 style="font-size:19px;margin:8px 0 4px;word-break:break-word">${esc(t.title)}</h2>
    ${t.detail ? `<div class="detail">${esc(t.detail)}</div>` : ''}
    <dl class="kv">
      <dt>ผู้สั่ง</dt><dd>${esc(t.assignerName)}</dd>
      <dt>ผู้รับ</dt><dd>${esc(t.assigneeName)}</dd>
      <dt>กำหนดส่ง</dt><dd style="${t.overdue ? 'color:var(--danger);font-weight:600' : ''}">${esc(fmt(t.dueDate))}${t.overdue ? ' · เกินกำหนด' : ''}</dd>
      <dt>สั่งเมื่อ</dt><dd>${esc(fmt(t.createdAt))}</dd>
      ${t.completedAt ? `<dt>ปิดงานเมื่อ</dt><dd>${esc(fmt(t.completedAt))}</dd>` : ''}
    </dl>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>ความคืบหน้า</span><b>${t.progress}%</b></div>
    ${pbar(t.progress, STATUS_COLOR[t.status])}
  </div>`;

  // ฝั่งผู้รับงาน
  if (t.canWork) {
    if (t.status === 'REVISE' && t.lastNote) h += `<div class="banner warn"><b>ผู้สั่งขอให้แก้ไข:</b><br>${esc(t.lastNote)}</div>`;
    h += `<div class="section-title">อัปเดตงานของฉัน</div><div class="card">`;
    if (t.status === 'NEW') h += `<button class="btn blue" style="margin-top:0" onclick="doAck()">👍 รับทราบงานนี้</button><div class="note-hint" style="text-align:center;margin:6px 0 4px">หรืออัปเดตความคืบหน้าได้ทันที</div>`;
    h += `<label class="f" ${t.status === 'NEW' ? '' : 'style="margin-top:0"'}>ความคืบหน้า</label>
      <div class="range"><input type="range" id="prog" min="0" max="100" step="5" value="${t.progress}"><output id="progOut">${t.progress}%</output></div>
      <label class="f">บันทึกการทำงาน</label>
      <textarea id="workNote" placeholder="ทำอะไรไปแล้ว ติดปัญหาอะไร หรือสรุปผลงาน"></textarea>
      ${photoPicker('work')}
      <div class="row2"><button class="btn sec" onclick="doUpdate()">💾 บันทึก</button><button class="btn violet" onclick="doSubmit()">📤 ส่งงาน</button></div>
      <div class="note-hint">"ส่งงาน" = เสร็จแล้ว แจ้งผู้สั่งให้ตรวจรับ</div></div>`;
  } else if (t.isAssignee && t.status === 'SUBMITTED') {

        <label class="f">ความเห็นถึงผู้รับ <span style="font-weight:400">(จำเป็นเมื่อขอให้แก้ไข)</span></label>
        <textarea id="reviewNote" placeholder="เช่น เรียบร้อยดี ขอบคุณครับ / ช่วยแก้ตัวเลขในหน้า 2"></textarea>
        <label class="f">กำหนดส่งใหม่ (ถ้าขอแก้ไข)</label>
        <input type="datetime-local" id="reviseDue" value="${t.dueDate ? toLocalInput(new Date(Math.max(new Date(t.dueDate), Date.now() + 86400000))) : ''}">
        <div class="row2"><button class="btn red" onclick="doRevise()">🔁 ขอให้แก้ไข</button><button class="btn" onclick="doApprove()">✔ ตรวจรับ ปิดงาน</button></div>
      </div>`;
    }
    h += `<div class="card"><details class="manage"><summary>⚙️ จัดการงาน (ผู้สั่ง)</summary>
      <label class="f">ชื่องาน</label><input type="text" id="eTitle" value="${esc(t.title)}" maxlength="200">
      <label class="f">รายละเอียด</label><textarea id="eDetail" maxlength="3000">${esc(t.detail)}</textarea>
      <label class="f">ความเร่งด่วน</label><select id="ePrio">${Object.keys(PRIORITY_TH).map(k => `<option value="${k}" ${k === t.priority ? 'selected' : ''}>${PRIORITY_TH[k]}</option>`).join('')}</select>
      <label class="f">กำหนดส่ง</label><input type="datetime-local" id="eDue" value="${t.dueDate ? toLocalInput(new Date(t.dueDate)) : ''}">
      <button class="btn blue" onclick="doEdit()">บันทึกการแก้ไข</button>
      ${t.status !== 'SUBMITTED' ? `<button class="btn sec" onclick="doApprove(true)">✔ ปิดงานทันที</button>` : ''}
      <button class="btn ghost-red" onclick="doCancel()">ยกเลิกงานนี้</button>
    </details></div>`;
  }

  // ความเห็นทั้งสองฝ่าย
  if ((t.isAssignee || t.isAssigner) && t.assigneeId !== t.assignerId) {
    h += `<div class="section-title">ส่งข้อความถึง${t.isAssignee ? 'ผู้สั่ง' : 'ผู้รับ'}</div><div class="card">
      <textarea id="cmtNote" placeholder="สอบถาม / แจ้งข้อมูลเพิ่มเติม" style="min-height:64px"></textarea>
      ${photoPicker('cmt')}
      <button class="btn sec" onclick="doComment()">💬 ส่งข้อความ</button></div>`;
  }

  h += `<div class="section-title">ประวัติการดำเนินงาน</div><div class="timeline">` +
    updates.map(u => `<div class="ev" style="--dc:${TYPE_COLOR[u.type] || '#94A3B8'}">
      <div class="h"><b>${esc(u.userName)}</b> · ${esc(u.typeTh)}${u.type === 'PROGRESS' || u.type === 'SUBMIT' ? ' ' + u.progress + '%' : ''}</div>
      <div class="tm">${esc(fmt(u.createdAt))} · ${esc(ago(u.createdAt))}</div>
      ${u.note && u.type !== 'CREATE' ? `<div class="n">${esc(u.note)}</div>` : ''}
      ${u.imageUrl ? `<a href="${esc(u.imageUrl)}" target="_blank" rel="noopener"><img src="${esc(u.imageUrl)}" alt="รูปแนบ" loading="lazy"></a>` : ''}
    </div>`).join('') + `</div>`;
  return h;
}
pageTask.after = function (p) {
  const r = $('#prog');
  if (r) r.oninput = () => $('#progOut').textContent = r.value + '%';

function photoPicker(k) {

async function pickPhoto(inp) {
  const k = inp.dataset.photo, file = inp.files[0];
  if (!file) return;
  try {
    S.img[k] = await resizeImage(file, 1280, 0.8);
    $(`#ph-${k} .pv`).innerHTML = `<img src="${S.img[k]}"> <button type="button" class="x" onclick="clearPhoto('${k}')">ลบรูป</button>`;
  } catch (e) { toast('อ่านรูปไม่ได้', true); }
}
function clearPhoto(k) { delete S.img[k]; $(`#ph-${k} .pv`).innerHTML = ''; $(`#ph-${k} input`).value = ''; }
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

const reload = () => render();
async function doAck() { try { await act('ack', { id: S.task.taskId }, 'รับทราบงานแล้ว ระบบแจ้งผู้สั่งให้'); reload(); } catch (e) { } }

  try {
    await act('update', { id: S.task.taskId, progress: Number($('#prog').value), note: $('#workNote').value, image: S.img.work || '' }, 'บันทึกความคืบหน้าแล้ว');
    reload();
  } catch (e) { }
}
async function doSubmit() {
  if (!confirm('ยืนยันส่งงานให้ผู้สั่งตรวจรับ?')) return;
  try { await act('submit', { id: S.task.taskId, note: $('#workNote').value, image: S.img.work || '' }, 'ส่งงานแล้ว ระบบแจ้งผู้สั่งให้'); reload(); } catch (e) { }
}
async function doApprove(direct) {
  if (direct && !confirm('ปิดงานนี้เลยหรือไม่? (ถือว่างานเสร็จสมบูรณ์)')) return;
  const note = $('#reviewNote') ? $('#reviewNote').value : '';
  try { await act('approve', { id: S.task.taskId, note }, 'ปิดงานเรียบร้อย'); reload(); } catch (e) { }
}
async function doRevise() {
  const note = $('#reviewNote').value.trim();
  if (!note) { toast('กรุณาระบุสิ่งที่ต้องการให้แก้ไข', true); $('#reviewNote').focus(); return; }
  const due = $('#reviseDue').value;
  try { await act('revise', { id: S.task.taskId, note, dueDate: due ? new Date(due).toISOString() : '' }, 'ส่งกลับให้แก้ไขแล้ว'); reload(); } catch (e) { }
}
async function doEdit() {
  const due = $('#eDue').value;
  try {
    await act('edit', { id: S.task.taskId, title: $('#eTitle').value, detail: $('#eDetail').value, priority: $('#ePrio').value, dueDate: due ? new Date(due).toISOString() : undefined }, 'บันทึกแล้ว แจ้งผู้รับให้');
    reload();
  } catch (e) { }
}
async function doCancel() {
  const note = prompt('เหตุผลที่ยกเลิก (จะแจ้งผู้รับ)');
  if (note === null) return;
  try { await act('cancel', { id: S.task.taskId, note }, 'ยกเลิกงานแล้ว'); reload(); } catch (e) { }
}
async function doComment() {
  const note = $('#cmtNote').value;
  if (!note.trim() && !S.img.cmt) return toast('กรุณาพิมพ์ข้อความ', true);
  try { await act('comment', { id: S.task.taskId, note, image: S.img.cmt || '' }, 'ส่งข้อความแล้ว'); reload(); } catch (e) { }
}

/* ---------- ข้อมูลของฉัน ---------- */
async function pageProfile() {
  const me = await api('me'); S.me = me.user; applyRole();
  const u = me.user;
  return `<div class="card" style="text-align:center">${avatar(u.name, u.pictureUrl, 64, 'margin:0 auto 8px')}
    <b style="font-size:17px">${esc(u.name)}</b><div style="font-size:13px;color:var(--muted)">LINE: ${esc(u.displayName)}</div>
    <div style="margin-top:8px">${u.isAdmin ? badge('ผู้ดูแลระบบ', '#0F172A') + ' ' : ''}${u.canAssign ? badge('สั่งงานได้', '#06C755') : badge('รับงาน', '#64748B')}</div></div>
    <div class="card"><label class="f" style="margin-top:0">ชื่อที่ใช้แสดงในระบบ</label><input type="text" id="nick" value="${esc(u.nickname)}" placeholder="${esc(u.displayName)}" maxlength="60">
    <label class="f">แผนก / ตำแหน่ง</label><input type="text" id="dept" value="${esc(u.department)}" maxlength="60" placeholder="เช่น ฝ่ายขาย">

    <button class="btn sec" onclick="openGuide()">📖 เปิดคู่มือการใช้งาน</button>`;
}
async function saveProfile() {
  try { await act('updateProfile', { nickname: $('#nick').value, department: $('#dept').value }, 'บันทึกแล้ว'); S.users = null; go('home'); } catch (e) { }
}

/* ---------- เริ่มต้น ---------- */
function applyRole() {
  const can = S.me && S.me.canAssign;
  $('#tabAssign').hidden = !can; $('#tabAssigned').hidden = !can;
  $('#meAvatar').innerHTML = S.me ? avatar(S.me.name, S.me.pictureUrl) : '';
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('button[data-go]'); if (b) go(b.dataset.go, b.dataset.go === S.page ? S.params : {}); });
$('#backBtn').onclick = () => { if (history.length > 1 && history.state) history.back(); else go('home'); };

function openGuide(sec, replace) {
  const url = 'guide.html' + (sec && /^[a-z]+$/.test(sec) ? '#' + sec : '');
  if (replace) location.replace(url); else location.href = url;
}

async function boot() {
  try {
    if (!IS_MOCK) await liff.init({ liffId: CONFIG.LIFF_ID });
    // ลิงก์คู่มือจากแชท: ?page=guide&sec=group → เปิด guide.html (ไม่ต้องเข้าสู่ระบบ)
    const qs0 = new URLSearchParams(location.search);
    if (qs0.get('page') === 'guide') { openGuide(qs0.get('sec'), true); return; }
    if (!IS_MOCK && !liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const qp = new URLSearchParams(location.search);
    const params = {};
    qp.forEach((v, k) => { if (k !== 'page' && k !== 'mock' && k !== 'liff.state') params[k] = v; });
    $('#tabbar').hidden = false;
    const me = await api('me'); S.me = me.user; applyRole();
    go(qp.get('page') || 'home', params, true);
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><div class="big">⚠️</div>เชื่อมต่อไม่สำเร็จ<br><span style="font-size:13px">${esc(e.message || e)}</span></div>`;
  }
}

/* =========================================================
 *  โหมดตัวอย่าง (ข้อมูลจำลอง) — ใช้ดูหน้าตาก่อนติดตั้งจริง
 * ========================================================= */
const MOCK = (() => {
  const H = 3600000, D = 86400000, now = Date.now(), iso = ms => new Date(ms).toISOString();
  const users = [
    { userId: 'U1', name: 'คุณสมชาย (หัวหน้า)', displayName: 'Somchai', nickname: 'คุณสมชาย (หัวหน้า)', department: 'ฝ่ายปฏิบัติการ', pictureUrl: '', canAssign: true, isAdmin: true },
    { userId: 'U2', name: 'น้องฝน', displayName: 'Fon', nickname: 'น้องฝน', department: 'ฝ่ายขาย', pictureUrl: '', canAssign: false, isAdmin: false },
    { userId: 'U3', name: 'พี่บอย', displayName: 'Boy', nickname: 'พี่บอย', department: 'คลังสินค้า', pictureUrl: '', canAssign: true, isAdmin: false },
    { userId: 'U4', name: 'มายด์', displayName: 'Mind', nickname: 'มายด์', department: 'บัญชี', pictureUrl: '', canAssign: false, isAdmin: false },
  ];
  const me = users[0];
  const nm = id => (users.find(u => u.userId === id) || {}).name || '-';
  let seq = 7;
  const tasks = [
    { taskId: 'T0001', title: 'สรุปยอดขายประจำสัปดาห์', detail: 'แยกตามสาขา พร้อมกราฟเทียบสัปดาห์ก่อน', assignerId: 'U1', assigneeId: 'U2', priority: 'HIGH', dueDate: iso(now + 5 * H), status: 'IN_PROGRESS', progress: 60, createdAt: iso(now - 2 * D), updatedAt: iso(now - 3 * H), lastNote: 'รวบรวมข้อมูลครบ 4 จาก 6 สาขา' },
    { taskId: 'T0002', title: 'ตรวจนับสต็อกคลัง B', detail: '', assignerId: 'U1', assigneeId: 'U3', priority: 'NORMAL', dueDate: iso(now - D), status: 'ACK', progress: 0, createdAt: iso(now - 4 * D), updatedAt: iso(now - 4 * D), lastNote: '' },
    { taskId: 'T0003', title: 'ปิดงบประจำเดือน ต.ค.', detail: 'ส่งไฟล์ Excel และ PDF', assignerId: 'U1', assigneeId: 'U4', priority: 'URGENT', dueDate: iso(now + 2 * D), status: 'SUBMITTED', progress: 100, createdAt: iso(now - 6 * D), updatedAt: iso(now - H), lastNote: 'แนบไฟล์ไว้ในไดรฟ์ทีมแล้วครับ' },
    { taskId: 'T0004', title: 'เตรียมสไลด์ประชุมผู้บริหาร', detail: 'ไม่เกิน 10 หน้า', assignerId: 'U3', assigneeId: 'U1', priority: 'NORMAL', dueDate: iso(now + 3 * D), status: 'NEW', progress: 0, createdAt: iso(now - 2 * H), updatedAt: iso(now - 2 * H), lastNote: '' },
    { taskId: 'T0005', title: 'อัปเดตรายชื่อลูกค้าในระบบ CRM', detail: '', assignerId: 'U1', assigneeId: 'U2', priority: 'LOW', dueDate: iso(now + 7 * D), status: 'NEW', progress: 0, createdAt: iso(now - 30 * 60000), updatedAt: iso(now - 30 * 60000), lastNote: '' },
    { taskId: 'T0006', title: 'ทำใบเสนอราคาลูกค้า ABC', detail: '', assignerId: 'U1', assigneeId: 'U2', priority: 'NORMAL', dueDate: iso(now - 3 * D), status: 'DONE', progress: 100, createdAt: iso(now - 8 * D), updatedAt: iso(now - 3 * D), completedAt: iso(now - 3 * D), lastNote: '' },
  ];
  const updates = [
    { taskId: 'T0001', userId: 'U1', type: 'CREATE', progress: 0, note: '', createdAt: iso(now - 2 * D) },
    { taskId: 'T0001', userId: 'U2', type: 'ACK', progress: 0, note: '', createdAt: iso(now - 2 * D + H) },
    { taskId: 'T0001', userId: 'U2', type: 'PROGRESS', progress: 30, note: 'เริ่มดึงข้อมูลจาก POS', createdAt: iso(now - D) },
    { taskId: 'T0001', userId: 'U2', type: 'PROGRESS', progress: 60, note: 'รวบรวมข้อมูลครบ 4 จาก 6 สาขา', createdAt: iso(now - 3 * H) },
    { taskId: 'T0003', userId: 'U1', type: 'CREATE', progress: 0, note: '', createdAt: iso(now - 6 * D) },
    { taskId: 'T0003', userId: 'U4', type: 'SUBMIT', progress: 100, note: 'แนบไฟล์ไว้ในไดรฟ์ทีมแล้วครับ', createdAt: iso(now - H) },
  ];
  const TYPE_TH = { CREATE: 'สั่งงาน', ACK: 'รับทราบงาน', PROGRESS: 'อัปเดตความคืบหน้า', SUBMIT: 'ส่งงาน', APPROVE: 'ตรวจรับ/ปิดงาน', REVISE: 'ขอให้แก้ไข', CANCEL: 'ยกเลิกงาน', EDIT: 'แก้ไขรายละเอียด', COMMENT: 'ความเห็น' };
  const dto = t => Object.assign({}, t, { assignerName: nm(t.assignerId), assigneeName: nm(t.assigneeId), overdue: ACTIVE.includes(t.status) && new Date(t.dueDate) < new Date() });
  const find = id => { const t = tasks.find(x => x.taskId === id); if (!t) throw new Error('ไม่พบงาน'); return t; };
  const log = (t, type, note, img) => updates.push({ taskId: t.taskId, userId: me.userId, type, progress: t.progress, note: note || '', imageUrl: img || '', createdAt: new Date().toISOString() });
  const touch = (t, ch) => Object.assign(t, ch, { updatedAt: new Date().toISOString() });
  const sort = l => l.sort((a, b) => (ACTIVE.includes(b.status) - ACTIVE.includes(a.status)) || (new Date(a.dueDate) - new Date(b.dueDate)));
  const stats = () => {
    const today = new Date().toDateString(), m = tasks.filter(t => t.assigneeId === me.userId), a = tasks.filter(t => t.assignerId === me.userId), act = t => ACTIVE.includes(t.status);
    return {
      mine: { active: m.filter(act).length, newCount: m.filter(t => t.status === 'NEW').length, overdue: m.filter(t => dto(t).overdue).length, dueToday: m.filter(t => act(t) && new Date(t.dueDate).toDateString() === today).length, revise: m.filter(t => t.status === 'REVISE').length, submitted: 0, doneThisMonth: m.filter(t => t.status === 'DONE').length },
      assigned: { active: a.filter(act).length, waitingReview: a.filter(t => t.status === 'SUBMITTED').length, overdue: a.filter(t => dto(t).overdue).length, notAcked: a.filter(t => t.status === 'NEW').length, doneThisMonth: a.filter(t => t.status === 'DONE').length },
    };
  };
  const h = {
    me: () => ({ user: me, stats: stats() }),
    users: () => users,
    updateProfile: p => { me.nickname = p.nickname; me.department = p.department; me.name = p.nickname || me.displayName; return { user: me }; },
    listTasks: p => sort(tasks.filter(t => p.scope === 'all' || (p.scope === 'assigned' ? t.assignerId === me.userId : t.assigneeId === me.userId))).map(dto),
    getTask: p => {
      const t = dto(find(p.id)), isA = t.assigneeId === me.userId, isM = t.assignerId === me.userId || me.isAdmin;
      return {
        task: Object.assign(t, { isAssignee: isA, isAssigner: isM, canWork: isA && ['NEW', 'ACK', 'IN_PROGRESS', 'REVISE'].includes(t.status), canManage: isM && ACTIVE.includes(t.status) }),
        updates: updates.filter(u => u.taskId === t.taskId).map(u => Object.assign({}, u, { typeTh: TYPE_TH[u.type], userName: nm(u.userId) })).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1),
      };
    },
    createTask: p => p.assigneeIds.map(id => {
      const t = { taskId: 'T' + String(seq++).padStart(4, '0'), title: p.title, detail: p.detail, assignerId: me.userId, assigneeId: id, priority: p.priority, dueDate: p.dueDate, status: 'NEW', progress: 0, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), lastNote: '' };
      tasks.push(t); log(t, 'CREATE', p.detail); return dto(t);
    }),
    ack: p => { const t = find(p.id); touch(t, { status: 'ACK' }); log(t, 'ACK'); return dto(t); },
    update: p => { const t = find(p.id); touch(t, { status: 'IN_PROGRESS', progress: p.progress, lastNote: p.note || t.lastNote }); log(t, 'PROGRESS', p.note, p.image); return dto(t); },
    submit: p => { const t = find(p.id); touch(t, { status: 'SUBMITTED', progress: 100, lastNote: p.note || t.lastNote }); log(t, 'SUBMIT', p.note, p.image); return dto(t); },
    approve: p => { const t = find(p.id); touch(t, { status: 'DONE', progress: 100, completedAt: new Date().toISOString() }); log(t, 'APPROVE', p.note); return dto(t); },
    revise: p => { const t = find(p.id); touch(t, { status: 'REVISE', lastNote: p.note, progress: Math.min(t.progress, 90), dueDate: p.dueDate || t.dueDate }); log(t, 'REVISE', p.note); return dto(t); },
    cancel: p => { const t = find(p.id); touch(t, { status: 'CANCELLED' }); log(t, 'CANCEL', p.note); return dto(t); },
    edit: p => { const t = find(p.id); touch(t, { title: p.title, detail: p.detail, priority: p.priority, dueDate: p.dueDate || t.dueDate }); log(t, 'EDIT', 'แก้ไขรายละเอียดงาน'); return dto(t); },
    comment: p => { const t = find(p.id); log(t, 'COMMENT', p.note, p.image); return dto(t); },
  };
  return { call: (a, p) => new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(h[a](p)))); } catch (e) { rej(e); } }, 250)) };
})();

boot();
